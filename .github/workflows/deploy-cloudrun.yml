name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  # Project the Cloud Run service is deployed into.
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  # Project that owns the Artifact Registry repository. Images live in the shared
  # registry project, which is not the project the service runs in.
  REGISTRY_PROJECT_ID: ${{ secrets.GAR_PROJECT_ID || 'skysql-registry' }}
  SERVICE_ACCOUNT: ${{ secrets.GCP_SERVICE_ACCOUNT }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
  GAR_REGISTRY: ${{ secrets.GAR_REGISTRY }}
  REPOSITORY: skysql
  REGION: us-central1
  IMAGE: skysql-mcp-server
  SERVICE: skysql-mcp-server

jobs:
  build-and-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Google Auth
        id: google_auth
        uses: google-github-actions/auth@v3
        with:
          token_format: access_token
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          username: oauth2accesstoken
          password: ${{ steps.google_auth.outputs.access_token }}
          registry: ${{ env.GAR_REGISTRY }}

      # Composed once and published as a job output so the deploy job cannot drift
      # from what was actually pushed. Workflow-level env cannot reference other env.
      - name: Compose image URI
        id: image
        run: |
          echo "uri=${GAR_REGISTRY}/${REGISTRY_PROJECT_ID}/${REPOSITORY}/${IMAGE}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.uri }}:latest
            ${{ steps.image.outputs.uri }}:${{ github.sha }}

  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Google Auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.PROJECT_ID }}
          service_account: ${{ env.SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ needs.build-and-push.outputs.image }}:${{ github.sha }}
          flags: |
            --port=8000
            --allow-unauthenticated
            --set-env-vars=MCP_HOST=0.0.0.0,MCP_PORT=8000
            --min-instances=0
            --max-instances=3
            --memory=512Mi
            --cpu=1
            --timeout=300
